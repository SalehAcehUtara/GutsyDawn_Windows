name: Auto Release Windows EXE

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller GutsyDawn.spec

      - name: Prepare Files for Release
        run: |
          Copy-Item -Path "README.md" -Destination "dist\GutsyDawn\" -Force
          Copy-Item -Path "version.txt" -Destination "dist\GutsyDawn\" -Force
          Copy-Item -Path "whatsnew.txt" -Destination "dist\GutsyDawn\" -Force

      - name: Create ZIP Archive
        run: |
          Compress-Archive -Path "dist\GutsyDawn\*" -DestinationPath "GutsyDawn.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: GutsyDawn.zip
          body_path: whatsnew.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}